[package]
name = "kcl-lib-lua"
version = "0.13.0"
edition = "2024"
publish = false

[features]
lua51 = ["mlua", "mlua/lua51"]
lua52 = ["mlua", "mlua/lua52"]
lua53 = ["mlua", "mlua/lua53"]
lua54 = ["mlua", "mlua/lua54"]
luajit = ["mlua", "mlua/luajit"]
luajit52 = ["mlua", "mlua/luajit52"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# 0.12 is required for plugin support: the plugin agent is a bare
# `extern "C"` callback with no user data, so it has to reach the interpreter
# through the raw `lua_State` and `Lua::get_or_init_from_ptr`, neither of
# which is public in 0.9.
mlua = { version = "0.12", features = [
  "module",
  "macros",
], default-features = false, optional = true }
kcl-api = { git = "https://github.com/kcl-lang/kcl", version = "0.13.0" }
