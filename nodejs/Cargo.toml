[package]
edition = "2024"
name = "kcl-nodejs-lib"
version = "0.13.1"

[lib]
crate-type = ["cdylib"]

[dependencies]
kcl-api = { git = "https://github.com/kcl-lang/kcl", version = "0.13.1" }
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "2.12.2", default-features = false, features = ["napi4"] }
napi-derive = "2.12.2"
# Used to encode/decode ListMethod arguments through the
# universal `kcl_api::call` dispatcher since `KclServiceImpl` does not
# expose a typed wrapper for that RPC.
prost = "0.14"
# Used to render `KclType` — which `#[napi(object)]` cannot express because
# it recurses through plain message fields — as canonical protobuf JSON.
serde_json = "1.0"

[build-dependencies]
napi-build = "2.0.1"

[profile.release]
lto = true
strip = "symbols"
