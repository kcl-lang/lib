[package]
name = "kcl-lib-c"
version = "0.13.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]
doc = false

[dependencies]
# Same tag as every other binding. An older rev (this crate used to pin
# 3ec296a / kcl 0.13.0) predates RPCs the consistency manifest calls.
kcl-api = { git = "https://github.com/kcl-lang/kcl", version = "0.13.3", tag = "v0.13.3" }
