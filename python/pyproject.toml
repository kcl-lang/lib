[build-system]
# 1.14 is the first release that knows about Python 3.15; 1.15.0 is what CI
# pins. The old floor of 1.5 predates both the pyo3 pin it was working around
# and any CPython this project targets.
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "kcl_lib"
version = "0.13.2"
# protobuf 7.x needs Python >=3.10, so a 3.9 build of this wheel could never
# install. pyo3 0.30 would support 3.9, but that would be a lie.
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
description = "KCL Programming Language Python Lib"
license = { text = "Apache-2.0" }

dependencies = [
    "protobuf>=7.36.2"
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "kcl_lib._kcl_lib"
python-source = "."

[project.optional-dependencies]
docs = ["pdoc"]
lint = ["ruff"]
test = ["pytest"]

[project.urls]
Documentation = "https://kcl-lang.io"
Homepage = "https://kcl-lang.io"
Repository = "https://github.com/kcl-lang/kcl"

[tool.ruff.lint]
ignore = ["F403", "F405"]
