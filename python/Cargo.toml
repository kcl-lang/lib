[package]
name = "kcl-python-lib"
version = "0.13.2"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]

[dependencies]
kcl-api = { git = "https://github.com/kcl-lang/kcl", version = "0.13.2" }
# 0.30 is the first line with final Python 3.15 support (0.29 had it as beta).
# It requires Python >=3.9, which is why `requires-python` is not lower.
pyo3 = "0.30"
