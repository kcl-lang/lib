name: zig-test

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - main
    paths:
      - "zig/**"
      # The consistency runner reads this shared manifest, so a golden-only
      # change must re-run this workflow.
      - "tests/consistency/**"
      - ".github/workflows/zig-test.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    defaults:
      run:
        working-directory: "zig"
    strategy:
      matrix:
        os: [macos-15-intel, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: korandoru/setup-zig@v1
      with:
        zig-version: 0.16.0
    - uses: arduino/setup-protoc@v3
      with:
        version: "29.x"
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Check
      run: zig fmt --check .
    - name: Build and Test
      run: zig build test
