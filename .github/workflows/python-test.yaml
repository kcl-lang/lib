# Derived from `maturin generate-ci github`, but hand-maintained since:
# the wheel jobs gained a Python-version dimension and the `test` job carries
# comments explaining why it builds in place. Re-running the generator would
# drop both, so edit this file directly and keep it in sync with maturin's shape.
name: python-test

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - main
    paths:
      - "python/**"
      # The consistency runner reads this shared manifest, so a golden-only
      # change must re-run this workflow.
      - "tests/consistency/**"
      # tests/ast_contract_test.py decodes the captured parser output as its
      # fixture, so regenerating the golden file must re-run this workflow.
      - "testdata/ast/**"
      - ".github/workflows/python-test.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          working-directory: "python"
          command: sdist
          args: -o dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist-${{ github.run_id }}
          path: python/dist

  # The `python` dimension selects the interpreter each wheel is built against;
  # `default` keeps whatever the runner ships, which is what produced every
  # wheel up to cp314. Add a leg here for a new CPython.
  #
  # Linux builds inside a maturin-managed manylinux container, so `-i` is the
  # only thing that selects the interpreter there -- installing Python on the
  # runner would have no effect on the build. maturin rejects `-i` together
  # with `--find-interpreter`, so each leg passes exactly one. macOS and
  # Windows build on the host, so those jobs select it with
  # actions/setup-python and let `--find-interpreter` resolve it.
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [ x86_64, aarch64 ]
        python: [ default, "3.15" ]
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: auto
          working-directory: "python"
          command: build
          args: --release -o dist ${{ matrix.python != 'default' && format('-i python{0}', matrix.python) || '--find-interpreter' }}
        env:
          # Workaround ring 0.17 build issue
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
      - name: Upload wheels-linux-${{ matrix.target }}-${{ matrix.python }}-${{ github.run_id }}
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.python }}-${{ github.run_id }}
          path: python/dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: [ default, "3.15" ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python }}
        if: matrix.python != 'default'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          working-directory: "python"
          command: build
          args: --release -o dist --find-interpreter
      - name: Upload wheels-windows-${{ matrix.python }}-${{ github.run_id }}
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.python }}-${{ github.run_id }}
          path: python/dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python: [ default, "3.15" ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python }}
        if: matrix.python != 'default'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          working-directory: "python"
          command: build
          target: universal2-apple-darwin
          args: --release -o dist --find-interpreter
      - name: Upload wheels-macos-${{ matrix.python }}-${{ github.run_id }}
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.python }}-${{ github.run_id }}
          path: python/dist

  test:
    name: Test on ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # "3.x" is the runner default; 3.15 is the newest CPython the wheels
        # ship, and the newest is the one most likely to break.
        python: [ "3.x", "3.15" ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Build the extension in-place via maturin develop so that the compiled
      # `_kcl_lib.<abi>.so` is placed inside `python/kcl_lib/` alongside its
      # Python source. This matters because the tests run with `working-directory:
      # python`, and `python/kcl_lib/__init__.py` (which does `from ._kcl_lib
      # import *`) would otherwise shadow the wheel's site-packages copy and
      # fail with `ModuleNotFoundError: No module named 'kcl_lib._kcl_lib'`.
      - name: Create virtualenv and install maturin + pytest
        working-directory: "python"
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/pip install maturin==1.15.0 pytest
          else
            .venv/bin/pip install maturin==1.15.0 pytest
          fi
      - name: Build extension in-place with maturin
        working-directory: "python"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/maturin develop --release
          else
            .venv/bin/maturin develop --release
          fi
      - name: Run pytest
        working-directory: "python"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/python -m pytest -v
          else
            .venv/bin/python -m pytest -v
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'"
    permissions:
      contents: read
      id-token: write
    needs: [ macos, linux, windows ]
    steps:
      # Collect every wheel leg in one step. The explicit per-name list this
      # replaces had to be hand-edited for every new target, platform, or
      # Python version; the pattern picks all of them up. `merge-multiple`
      # keeps them flat in python/dist rather than nesting a directory per
      # artifact. `wheels-` deliberately excludes the sdist artifact, which is
      # published separately and not wanted here.
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*-${{ github.run_id }}
          path: python/dist
          merge-multiple: true
      - name: Publish to PyPI
        # The issue https://github.com/pypa/gh-action-pypi-publish/issues/310 has not tagged a release yet
        # Use the commit hash to get the temporary fix
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          packages-dir: python/dist
