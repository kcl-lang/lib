name: python-test

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - main
    paths:
      - "python/**"
      - ".github/workflows/python-test.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: "python"
          command: sdist
          args: -o dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: sdist-${{ github.run_id }}
          path: python/dist

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [ x86_64, aarch64 ]
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          working-directory: "python"
          command: build
          args: --release -o dist --find-interpreter
        env:
          # Workaround ring 0.17 build issue
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
      - name: Upload wheels-linux-${{ matrix.target }}-${{ github.run_id }}
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}-${{ github.run_id }}
          path: python/dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: "python"
          command: build
          args: --release -o dist --find-interpreter
      - name: Upload wheels-windows-${{ github.run_id }}
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ github.run_id }}
          path: python/dist

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: "python"
          command: build
          target: universal2-apple-darwin
          args: --release -o dist --find-interpreter
      - name: Upload wheels-macos-${{ github.run_id }}
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ github.run_id }}
          path: python/dist

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      # Build the extension in-place via maturin develop so that the compiled
      # `_kcl_lib.<abi>.so` is placed inside `python/kcl_lib/` alongside its
      # Python source. This matters because the tests run with `working-directory:
      # python`, and `python/kcl_lib/__init__.py` (which does `from ._kcl_lib
      # import *`) would otherwise shadow the wheel's site-packages copy and
      # fail with `ModuleNotFoundError: No module named 'kcl_lib._kcl_lib'`.
      - name: Create virtualenv and install maturin + pytest
        working-directory: "python"
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/pip install maturin pytest
          else
            .venv/bin/pip install maturin pytest
          fi
      - name: Build extension in-place with maturin
        working-directory: "python"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/maturin develop --release
          else
            .venv/bin/maturin develop --release
          fi
      - name: Run pytest
        working-directory: "python"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/python -m pytest -v
          else
            .venv/bin/python -m pytest -v
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'"
    permissions:
      contents: read
      id-token: write
    needs: [ macos, linux, windows ]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64-${{ github.run_id }}
          path: python/dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-aarch64-${{ github.run_id }}
          path: python/dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-${{ github.run_id }}
          path: python/dist
      - uses: actions/download-artifact@v8
        with:
          name: wheels-macos-${{ github.run_id }}
          path: python/dist
      - name: Publish to PyPI
        # The issue https://github.com/pypa/gh-action-pypi-publish/issues/310 has not tagged a release yet
        # Use the commit hash to get the temporary fix
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          packages-dir: python/dist
