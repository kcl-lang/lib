name: swift-test

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - main
    paths:
      - "swift/**"
      - ".github/workflows/swift-test.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    defaults:
      run:
        working-directory: "swift"
    strategy:
      matrix:
        # https://github.com/swift-actions/setup-swift/issues/677
        # ubuntu-latest is not supported
        os: [macos-15-intel, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      if: "contains(matrix.os, 'ubuntu-22.04')"
      run: |
        sudo apt-get update
        sudo apt-get install libgtest-dev ninja-build
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.91
        override: true
        components: clippy, rustfmt
    - name: Setup Swift toolchain
      # The v3 Swiftly-based installer cannot provision Linux runners: its
      # post-install script runs apt-get without sudo and fails on the dpkg
      # lock. The ubuntu-22.04 image already ships a suitable Swift 6.3.x
      # toolchain, so only run the action where it works (macOS).
      if: runner.os != 'Linux'
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: "6.3"
    - name: Build and run tests
      run: make test
