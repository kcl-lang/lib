name: publish-kcltool

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - "dotnet/KclTool/**"
      - "dotnet/KclTool.runtime.*/**"
      - "dotnet/Directory.Build.props"
      - ".github/workflows/publish-kcltool.yaml"
  workflow_dispatch:

# The kcl executable is shipped as a pre-built artifact from the
# https://github.com/kcl-lang/cli release page. The CLI binary embeds
# (via the Go SDK) a specific kcl-lang.io/lib version — here v0.12.5 — and
# dynamically loads the matching `libkcl.{so,dylib,dll}` from `KCL_LIB_HOME`
# at runtime. We pin both versions and ship the matching libkcl alongside the
# binary so .NET consumers do not need a separate download or first-run
# auto-install step.
#
# When kcl-lang/cli publishes a v0.13.x release, bump KCL_CLI_VERSION and the
# matching KCL_LIB_REF below.
env:
  KCL_CLI_VERSION: v0.12.10
  KCL_LIB_REF: v0.12.5
  PACKAGE_VERSION: 0.13.0

jobs:
  build:
    name: Bundle kcl CLI for ${{ matrix.classifier }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-x64
            os: ubuntu-latest
            dotnet-rid: linux-x64
            archive: kcl-v0.12.10-linux-amd64.tar.gz
            archive-format: targz
            bin-name: kcl
            lib-name: libkcl.so
            lib-platform-dir: linux-amd64
          - classifier: linux-arm64
            os: ubuntu-24.04-arm
            dotnet-rid: linux-arm64
            archive: kcl-v0.12.10-linux-arm64.tar.gz
            archive-format: targz
            bin-name: kcl
            lib-name: libkcl.so
            lib-platform-dir: linux-arm64
          - classifier: osx-x64
            os: macos-14
            dotnet-rid: osx-x64
            archive: kcl-v0.12.10-darwin-amd64.tar.gz
            archive-format: targz
            bin-name: kcl
            lib-name: libkcl.dylib
            lib-platform-dir: darwin-amd64
          - classifier: osx-arm64
            os: macos-latest
            dotnet-rid: osx-arm64
            archive: kcl-v0.12.10-darwin-arm64.tar.gz
            archive-format: targz
            bin-name: kcl
            lib-name: libkcl.dylib
            lib-platform-dir: darwin-arm64
          - classifier: win-x64
            os: windows-latest
            dotnet-rid: win-x64
            archive: kcl-v0.12.10-windows-amd64.zip
            archive-format: zip
            bin-name: kcl.exe
            lib-name: kcl.dll
            lib-platform-dir: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Download kcl CLI release artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p cli-dl
          gh release download "${{ env.KCL_CLI_VERSION }}" \
            --repo kcl-lang/cli \
            --pattern '${{ matrix.archive }}' \
            --dir cli-dl
          ls -la cli-dl/

      - name: Extract kcl binary
        shell: bash
        run: |
          mkdir -p cli-bin
          case "${{ matrix.archive-format }}" in
            targz) tar -xzf "cli-dl/${{ matrix.archive }}" -C cli-bin ;;
            zip)   unzip -q  "cli-dl/${{ matrix.archive }}" -d cli-bin ;;
          esac
          ls -la cli-bin/

      - name: Check out matching kcl-lang/lib for libkcl binary
        uses: actions/checkout@v6
        with:
          repository: kcl-lang/lib
          ref: ${{ env.KCL_LIB_REF }}
          path: lib-src

      - name: Stage artifacts into per-RID package directory
        shell: bash
        run: |
          # Sanity-check the libkcl we are about to ship matches the SDK the
          # CLI was built against. The CLI auto-installs to a directory named
          # after KCL_VERSION; if that string doesn't match KCL_LIB_REF here
          # we are about to ship a mismatched pair — fail loudly.
          cli_version_in_lib="$(grep -E '^const KCL_VERSION' lib-src/go/install/install.go | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "lib kcl version: ${cli_version_in_lib}"
          echo "KCL_LIB_REF:     ${{ env.KCL_LIB_REF }}"
          if [[ "${cli_version_in_lib}" != "${{ env.KCL_LIB_REF }}" ]]; then
            echo "::error::libkcl version (${cli_version_in_lib}) does not match KCL_LIB_REF (${{ env.KCL_LIB_REF }}). Bump one of them."
            exit 1
          fi

          # Binaries land directly in the per-RID package directory. The
          # .csproj there uses <None Include="kcl" Pack="true" PackagePath=
          # "runtimes/<rid>/native/"> so the layout inside the .nupkg stays
          # standard runtimes/<rid>/native/ for the .NET runtime resolver.
          dest="dotnet/KclTool.runtime.${{ matrix.dotnet-rid }}"
          mkdir -p "${dest}"

          cp "cli-bin/${{ matrix.bin-name }}" "${dest}/"
          cp "lib-src/go/lib/${{ matrix.lib-platform-dir }}/${{ matrix.lib-name }}" "${dest}/"

          # Preserve +x on POSIX so consumers can run the binary directly.
          if [[ "${{ matrix.os }}" != windows* ]]; then
            chmod +x "${dest}/${{ matrix.bin-name }}"
          fi

          ls -la "${dest}"

      - uses: actions/upload-artifact@v6
        with:
          name: kcltool-${{ matrix.classifier }}
          if-no-files-found: error
          path: dotnet/KclTool.runtime.${{ matrix.dotnet-rid }}/

  deploy:
    name: Deploy KclTool to NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [ build ]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Each per-RID artifact stores dotnet/KclTool.runtime.<rid>/ at its root.
      # Downloading each into its own sub-dir lets us copy the populated
      # package directory back into the matching checkout path.
      - name: Download windows x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: kcltool-win-x64
          path: _artifacts/win-x64

      - name: Download linux arm64 artifact
        uses: actions/download-artifact@v7
        with:
          name: kcltool-linux-arm64
          path: _artifacts/linux-arm64

      - name: Download linux x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: kcltool-linux-x64
          path: _artifacts/linux-x64

      - name: Download darwin x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: kcltool-osx-x64
          path: _artifacts/osx-x64

      - name: Download darwin arm64 artifact
        uses: actions/download-artifact@v7
        with:
          name: kcltool-osx-arm64
          path: _artifacts/osx-arm64

      - name: Restage artifacts into per-RID package projects
        run: |
          set -euo pipefail
          # actions/upload-artifact@v6 strips the path's leading directory
          # when archiving, so each artifact's contents land at
          # _artifacts/<rid>/{kcl,libkcl.*,*.csproj} (NOT under a
          # dotnet/KclTool.runtime.<rid>/ wrapper).
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64; do
            src="_artifacts/${rid}"
            if [[ ! -d "${src}" ]]; then
              echo "::error::missing artifact for ${rid} (looked for ${src})"
              exit 1
            fi
            dest="dotnet/KclTool.runtime.${rid}"
            mkdir -p "${dest}"
            cp -R "${src}/." "${dest}/"
          done
          echo "---- staged files ----"
          find dotnet/KclTool.runtime.* -type f -not -name '.gitignore' | sort

      # Pack the five per-RID runtime asset packages first into a local
      # NuGet feed. They contain only native binaries and stay well below
      # NuGet's per-package size limit, so each is small enough to push
      # individually.
      - name: Pack per-RID runtime asset packages
        working-directory: dotnet
        run: |
          set -euo pipefail
          mkdir -p local-feed
          for csproj in KclTool.runtime.*/KclTool.runtime.*.csproj; do
            echo "---- packing ${csproj} ----"
            dotnet pack "${csproj}" -c Release -o local-feed -p:Version=${{ env.PACKAGE_VERSION }}
          done
          echo "---- local feed (per-RID) ----"
          ls -la local-feed

      # The main KclTool package declares <PackageReference>s to all five
      # KclTool.runtime.* packages. To pack it before pushing them to
      # NuGet.org, point NuGet at the local feed containing the just-built
      # per-RID packages.
      - name: Pack main KclTool
        working-directory: dotnet
        run: |
          set -euo pipefail
          cat > NuGet.Config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="./local-feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          dotnet pack KclTool/KclTool.csproj -c Release -o local-feed -p:Version=${{ env.PACKAGE_VERSION }}
          echo "---- local feed (final) ----"
          ls -la local-feed

      - uses: actions/upload-artifact@v6
        with:
          name: KclTool NuGet Packages
          path: |
            dotnet/local-feed/*.nupkg
            dotnet/local-feed/*.snupkg

      - name: Release to NuGet
        if: "startsWith(github.ref, 'refs/tags/')"
        working-directory: dotnet/local-feed
        run: |
          set -euo pipefail
          for pkg in *.nupkg; do
            echo "---- pushing ${pkg} ----"
            dotnet nuget push "${pkg}" -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
          done