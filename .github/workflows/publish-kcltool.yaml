name: publish-kcltool

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - "dotnet/KclTool/**"
      - ".github/workflows/publish-kcltool.yaml"
  workflow_dispatch:

jobs:
  build:
    name: Build kcl-cli on ${{ matrix.classifier }}
    defaults:
      run:
        working-directory: kcl-src
    strategy:
      fail-fast: false
      matrix:
        # Build for the runner's native architecture and let Cargo place outputs
        # in `target/release/`. The upstream kcl-cli build.rs resolves `libkcl`
        # via a relative `target/release` link-search path, which only matches
        # the native target layout. Use arch-specific runners instead of
        # `--target <triple>` cross-compiles.
        include:
          - classifier: linux-x64
            os: ubuntu-latest
            dotnet-rid: linux-x64
            lib-name: libkcl.so
            bin-name: kcl
          - classifier: linux-arm64
            os: ubuntu-24.04-arm
            dotnet-rid: linux-arm64
            lib-name: libkcl.so
            bin-name: kcl
          - classifier: osx-x64
            os: macos-15-intel
            dotnet-rid: osx-x64
            lib-name: libkcl.dylib
            bin-name: kcl
          - classifier: osx-arm64
            os: macos-latest
            dotnet-rid: osx-arm64
            lib-name: libkcl.dylib
            bin-name: kcl
          - classifier: win-x64
            os: windows-latest
            dotnet-rid: win-x64
            lib-name: kcl.dll
            bin-name: kcl.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Check out kcl-lang/kcl
        uses: actions/checkout@v6
        with:
          repository: kcl-lang/kcl
          ref: v0.13.0
          path: kcl-src
          submodules: "true"

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.91
          override: true
          components: clippy, rustfmt

      - name: Setup Windows MSVC dev command prompt
        if: "matrix.os == 'windows-latest'"
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build kcl-lib
        run: cargo build --release -p kcl-lib

      - name: Build kcl-cli
        run: cargo build --release -p kcl-cli

      - name: Stage artifacts
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          mkdir -p kcltool/runtimes/${{ matrix.dotnet-rid }}/native
          cp kcl-src/target/release/${{ matrix.lib-name }} kcltool/runtimes/${{ matrix.dotnet-rid }}/native/
          cp kcl-src/target/release/${{ matrix.bin-name }} kcltool/runtimes/${{ matrix.dotnet-rid }}/native/
          ls -la kcltool/runtimes/${{ matrix.dotnet-rid }}/native/

      - uses: actions/upload-artifact@v6
        with:
          name: kcltool-${{ matrix.classifier }}
          if-no-files-found: error
          path: kcltool/runtimes/${{ matrix.dotnet-rid }}/native/

  deploy:
    name: Deploy KclTool to NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [ build ]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Download windows x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: kcltool-win-x64
          path: dotnet/KclTool/runtimes/win-x64/native

      - name: Download linux arm64 artifact
        uses: actions/download-artifact@v7
        with:
          name: kcltool-linux-arm64
          path: dotnet/KclTool/runtimes/linux-arm64/native

      - name: Download linux x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: kcltool-linux-x64
          path: dotnet/KclTool/runtimes/linux-x64/native

      - name: Download darwin x64 artifact
        uses: actions/download-artifact@v7
        with:
          name: kcltool-osx-x64
          path: dotnet/KclTool/runtimes/osx-x64/native

      - name: Download darwin arm64 artifact
        uses: actions/download-artifact@v7
        with:
          name: kcltool-osx-arm64
          path: dotnet/KclTool/runtimes/osx-arm64/native

      - name: Pack KclTool
        working-directory: dotnet/KclTool
        run: |
          find runtimes -type f
          dotnet pack -c Release

      - uses: actions/upload-artifact@v6
        with:
          name: KclTool NuGet Package
          path: |
            dotnet/KclTool/bin/Release/*.nupkg
            dotnet/KclTool/bin/Release/*.snupkg

      - name: Release to NuGet
        if: "startsWith(github.ref, 'refs/tags/')"
        working-directory: dotnet/KclTool/bin/Release
        run: |
          dotnet nuget push KclTool.0.13.0.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json