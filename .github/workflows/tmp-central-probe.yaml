# TEMPORARY diagnostic workflow — delete once the Central Portal 401 on
# java-test/kotlin-test deploy-central is root-caused.
#
# Runs on any ref (not just tags) so the credential probe can be exercised
# from main without re-pointing a release tag.
name: tmp-central-probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tmp-central-probe.yaml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK (same inputs as deploy-central, post-fix)
        uses: actions/setup-java@v6.0.1
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        with:
          distribution: 'temurin'
          java-version: '8'
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN
          settings-path: ${{ github.workspace }}

      - name: Inspect the generated settings.xml
        run: |
          set -uo pipefail
          echo "settings.xml present: $(test -f "$GITHUB_WORKSPACE/settings.xml" && echo yes || echo NO)"
          echo "--- RAW settings.xml (GitHub masks any secret value) ---"
          cat "$GITHUB_WORKSPACE/settings.xml"
          echo "--- end raw ---"
          echo "--- server blocks (structure only) ---"
          # Print ids/usernames but never passwords; hash them instead.
          python3 - "$GITHUB_WORKSPACE/settings.xml" <<'PY'
          import hashlib, sys, xml.etree.ElementTree as ET
          path = sys.argv[1]
          try:
              root = ET.parse(path).getroot()
          except Exception as e:
              print(f"PARSE FAILED: {e}")
              sys.exit(0)
          ns = {"m": root.tag.split("}")[0].strip("{")} if "}" in root.tag else {}
          servers = root.iter(f"{{{root.tag.split('}')[0].strip('{')}}}server") if ns else root.iter("server")
          found = False
          for s in servers:
              found = True
              sid  = (s.findtext("id") or "")
              user = (s.findtext("username") or "")
              pw   = (s.findtext("password") or "")
              print(f"server id={sid!r} username={user!r} "
                    f"password_len={len(pw)} password_sha256_8={hashlib.sha256(pw.encode()).hexdigest()[:8]}")
          if not found:
              print("NO <server> BLOCKS FOUND -- setup-java did not write credentials")
          PY

      - name: Maven's view of the settings (no build)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          set -uo pipefail
          cd /tmp && rm -rf mvnx && mkdir mvnx && cd mvnx
          cat > pom.xml <<'XML'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>t</groupId><artifactId>t</artifactId><version>1</version><packaging>pom</packaging>
          </project>
          XML
          mvn -q -s "$GITHUB_WORKSPACE/settings.xml" \
            -Dmaven.repo.local=/tmp/mvnrepo help:effective-settings -Doutput=/tmp/eff.xml >/dev/null 2>&1
          if [ -f /tmp/eff.xml ]; then
            # Maven expands ${env.X} at read time, so this shows what the
            # central-publishing plugin would actually send.
            python3 - /tmp/eff.xml <<'PY'
          import hashlib, sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for s in root.iter():
              if s.tag.split("}")[-1] != "server":
                  continue
              g = lambda t: (s.findtext(t) or "")
              # ET resolves ${env.X} only if the raw text is kept; check both.
              print(f"server id={g('id')!r} username={g('username')!r} "
                    f"password_len={len(g('password'))} "
                    f"password_sha256_8={hashlib.sha256(g('password').encode()).hexdigest()[:8]}")
          PY
          else
            echo "help:effective-settings produced no output"
          fi

      - name: Report secret shape (never prints the secret)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          set -uo pipefail
          for v in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_TOKEN; do
            val="${!v}"
            echo "::group::$v"
            echo "bytes: $(printf %s "$val" | wc -c | tr -d ' ')"
            echo "sha256[0:8]: $(printf %s "$val" | sha256sum | cut -c1-8)"
            if [ -z "$val" ]; then
              echo "state: EMPTY"
            elif [ "$val" != "$(printf %s "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')" ]; then
              echo "state: leading/trailing WHITESPACE"
            else
              echo "state: clean"
            fi
            echo "::endgroup::"
          done

      - name: Probe Central Portal (GET, non-mutating)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 25 \
            -u "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_TOKEN" \
            https://central.sonatype.com/api/v1/publisher/upload) || code="000"
          echo "GET upload -> HTTP $code"
          echo "body: $(head -c 300 /tmp/body.txt)"

      - name: Reproduce the plugin's request shape (Java HttpClient defaults)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          set -uo pipefail
          # The Maven plugin sends HTTP/1.1 with a Java user-agent and, unlike
          # curl, does not always send Basic auth preemptively. If the edge
          # rejects that shape with an empty-bodied 401 that only curl passes,
          # it explains a CI-only 401 with a locally-working credential.
          for ua in "Apache-HttpClient/4.5.14 (Java/17)" "curl/8.7.1"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 \
              --http1.1 -A "$ua" -u "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_TOKEN" \
              https://central.sonatype.com/api/v1/publisher/upload) || code="000"
            echo "UA='$ua' -> HTTP $code"
          done