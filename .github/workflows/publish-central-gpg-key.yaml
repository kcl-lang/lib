name: publish-central-gpg-key

# Maven Central does not verify a bundle against the key material that
# travels with it. It looks the public key up, by the fingerprint registered
# on the namespace, on one of the key servers it supports
# (keyserver.ubuntu.com and keys.openpgp.org). The signing key itself lives
# in the repository secret, so its public half has to be published
# separately, and nothing publishes it on its own.
#
# That is what made the v0.13.3 bundle fail with:
#
#   Could not find a public key by the key fingerprint. Please ensure it is
#   uploaded to one of the PGP servers we support.
#
# This workflow publishes the public half of the signing key and verifies
# that the key servers hand it back. It runs on every push so the key stays
# published - key servers do drop entries - and it can be triggered by hand
# with the workflow_dispatch event.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-central-gpg-key:
    name: Publish the Maven Central signing key to a key server
    runs-on: ubuntu-latest
    steps:
      - name: Check out the publishing script
        uses: actions/checkout@v7

      - name: Publish the public key
        env:
          MAVEN_CENTRAL_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
          MAVEN_CENTRAL_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          hack/publish_central_gpg_key.sh central-signing-key.asc

      - name: Upload the public key as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: central-signing-key
          if-no-files-found: error
          path: central-signing-key.asc
