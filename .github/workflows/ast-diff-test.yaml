name: ast-diff-test

# `hack/check_ast_field_types.rb` (ast-shape-test.yaml) reads each binding's
# decoder *source* and compares field names against the Rust struct
# definitions. That is the right check for a decoder that names a field
# wrongly, and blind to a decoder that names every field correctly and then
# reads the wrong one level of nesting. That second bug has shipped five
# times; every occurrence produced `undefined` / `None` / `""` rather than
# raising, so every per-language test suite stayed green.
#
# This workflow closes that gap: it runs each binding's real decoder over the
# same capture (`testdata/ast/alignment.json`) and diffs what comes out
# against the golden.
#
# The job is a matrix of one binding each so a binding only installs its own
# toolchain. `hack/ast_diff.rb` exits non-zero when nothing agreed, so a
# binding whose toolchain failed to install shows up as a failure here rather
# than a silent skip.
on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - main
    paths:
      # hack/** covers the differ itself and every per-binding dump driver
      # under hack/dump/.
      - "hack/**"
      # The golden every binding is diffed against.
      - "testdata/ast/**"
      # One entry per binding's AST decoder.
      - "ruby/lib/kcl_lib/ast.rb"
      - "julia/src/ast.jl"
      - "lua/kcl_lib/ast.lua"
      - "dart/lib/src/ast/**"
      - "python/kcl_lib/ast/**"
      - "wasm/src/ast/**"
      - "nodejs/src/ast/**"
      - "dotnet/KclLib.AST/**"
      - "zig/src/ast/**"
      - "swift/Sources/KclLibAST/**"
      # C and C++ have one decoder each, in a header and its implementation.
      # `kcl_ast_json.hpp` is the C++ header's own JSON parser and is the
      # other half of `kcl_ast.hpp`'s decoder; `kcl_lib_ast.h` is the whole
      # public C contract and `kcl_lib_ast.c` its implementation.
      - "c/include/kcl_lib_ast.h"
      - "c/lib/kcl_lib_ast.c"
      - "cpp/include/kcl_ast.hpp"
      - "cpp/include/kcl_ast_json.hpp"
      # Java and Kotlin share one decoder (`kotlin` compiles the same
      # `com.kcl.ast` sources java does) but each has its own on top of it, so
      # both roots are listed. `.java` under the kotlin source root is that
      # shared decoder; the `.kt` files next to it are the writer and the
      # `New*` builders, which are kotlin's own and are the part nothing else
      # checks.
      - "java/src/main/java/com/kcl/ast/**"
      - "kotlin/src/main/java/com/kcl/ast/**"
      - "kotlin/src/main/kotlin/com/kcl/ast/**"
      # The dump drivers that do not build from source parse with the prebuilt
      # core from go/lib/, so refreshing it must re-run the diff.
      - "go/lib/**"
      - ".github/workflows/ast-diff-test.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diff:
    name: AST diff (${{ matrix.binding }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - binding: ruby
          - binding: python
          - binding: nodejs
          - binding: wasm
          - binding: lua
          - binding: julia
          - binding: dart
          - binding: zig
          - binding: dotnet
          # C and C++ need no toolchain step at all: both decoders are
          # self-contained, and `hack/dump/{c,cpp}.sh` compile their sources
          # against a stock cc / c++ on the runner image. Not `cargo build`
          # (neither decoder touches the runtime), not `libkcl` (both are
          # plain C and C++ over an embedded JSON parser), and not either
          # binding's cmake / Makefile, which build the protobuf and JNI
          # layers around them.
          - binding: c
          - binding: cpp
          # Java and Kotlin share a decoder but not a dumper: java is walked by
          # reflection over `com.kcl.ast`'s declared fields, and kotlin goes
          # through `AstWire.kt`, the writer it owns. Neither needs the JNI
          # shim, so unlike java-test.yaml and kotlin-test.yaml these legs build
          # nothing — `hack/dump/{java,kotlin}.sh` compile the AST sources
          # directly.
          #
          # JDK 17 rather than the zulu 8 the build matrices use: the dumper
          # compiles with `--release 8`, so the language level is pinned by the
          # scripts and not by this choice, and 17 is the version the pinned
          # kotlin-compiler 1.9.25 is known to run under. `cache: 'maven'` is
          # the difference between this leg taking two seconds and taking a
          # minute — the dumpers resolve their classpath through maven.
          - binding: java
          - binding: kotlin
          # The only binding that cannot share the default runner. The Swiftly
          # installer behind swift-actions/setup-swift@v3 cannot provision a
          # Linux runner — the same limitation that keeps swift-test.yaml off
          # Linux — so this one runs where that action works.
          - binding: swift
            os: macos-latest
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: "lib"
    steps:
    - uses: actions/checkout@v7
      with:
        path: lib
    # ast_diff.rb and its drivers are Ruby, so every job needs Ruby even when
    # the binding under test is not Ruby.
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.4"
    - uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: 1.91
    - name: Install protobuf
      # Linux only: the swift leg is the one that does not run on the default
      # runner, and it has no apt. `arduino/setup-protoc` covers zig above;
      # the bindings that shell out to protoc on Linux get it from apt here.
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    # --- ruby -------------------------------------------------------------
    - name: Build the ruby extension
      if: matrix.binding == 'ruby'
      working-directory: "lib/ruby"
      run: make build

    # --- python -----------------------------------------------------------
    # `maturin develop` installs the built extension into the active
    # virtualenv and refuses to run without one, so make it explicitly rather
    # than relying on the runner image having something.
    - name: Create the python virtualenv
      if: matrix.binding == 'python'
      working-directory: "lib/python"
      run: python3 -m venv .venv
    - name: Build the python extension
      if: matrix.binding == 'python'
      uses: PyO3/maturin-action@v1
      with:
        command: develop
        working-directory: lib/python
      env:
        VIRTUAL_ENV: ${{ github.workspace }}/lib/python/.venv

    # --- nodejs / wasm ----------------------------------------------------
    - name: Setup node
      if: matrix.binding == 'nodejs' || matrix.binding == 'wasm'
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Install nodejs dependencies
      if: matrix.binding == 'nodejs'
      working-directory: "lib/nodejs"
      run: npm install
    - name: Build nodejs
      if: matrix.binding == 'nodejs'
      working-directory: "lib/nodejs"
      run: npm run build
    - name: Install wasm dependencies
      if: matrix.binding == 'wasm'
      working-directory: "lib/wasm"
      run: npm install
    - name: Build wasm
      if: matrix.binding == 'wasm'
      working-directory: "lib/wasm"
      run: npm run build

    # --- lua --------------------------------------------------------------
    - name: Setup lua toolchain
      if: matrix.binding == 'lua'
      uses: leafo/gh-actions-lua@v13
      with:
        # The action defaults to 5.5, which the rockspec rejects outright
        # (`lua >= 5.1, < 5.5`). lua-test.yaml pins the same version per
        # matrix leg; here there is only one leg, so pin the newest the rock
        # accepts.
        luaVersion: "5.4"
    - name: Setup luarocks
      if: matrix.binding == 'lua'
      uses: leafo/gh-actions-luarocks@v6
    - name: Build the lua rock
      if: matrix.binding == 'lua'
      working-directory: "lib/lua"
      run: luarocks make ./*.rockspec

    # --- julia ------------------------------------------------------------
    - name: Setup Julia
      if: matrix.binding == 'julia'
      uses: julia-actions/setup-julia@v2
    - name: Instantiate the julia project
      if: matrix.binding == 'julia'
      working-directory: "lib/julia"
      run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

    # --- dart -------------------------------------------------------------
    - name: Install Dart SDK
      if: matrix.binding == 'dart'
      uses: dart-lang/setup-dart@v1
    - name: Resolve the prebuilt libkcl for the runner
      # The checkout lands in `lib/`, and the job default working-directory is
      # that same directory, so the repo root is $GITHUB_WORKSPACE/lib and the
      # prebuilt core is go/lib/<platform>/libkcl.<ext> under it. The directory
      # is `linux-amd64`, not `linux-x64` — the arch suffix follows the Go
      # embed dirs, not the NuGet/Rust target names.
      if: matrix.binding == 'dart'
      shell: bash
      run: |
        lib="$GITHUB_WORKSPACE/lib/go/lib/linux-amd64/libkcl.so"
        test -f "$lib" || (echo "missing prebuilt libkcl at $lib"; exit 1)
        echo "KCL_DART_LIB=$lib" >> "$GITHUB_ENV"
    - name: Fetch dart dependencies
      if: matrix.binding == 'dart'
      working-directory: "lib/dart"
      run: dart pub get

    # --- swift ------------------------------------------------------------
    - name: Setup Swift toolchain
      if: matrix.binding == 'swift'
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: "6.3"
    # No `swift package resolve`: hack/dump/swift.sh compiles the two AST
    # sources standalone with `swiftc` precisely so it does not need SwiftPM to
    # resolve the package graph over the network.

    # --- zig --------------------------------------------------------------
    - name: Setup zig
      if: matrix.binding == 'zig'
      uses: korandoru/setup-zig@v1
      with:
        zig-version: 0.16.0
    - name: Install protoc
      if: matrix.binding == 'zig'
      uses: arduino/setup-protoc@v3
      with:
        version: "29.x"
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    # --- dotnet -----------------------------------------------------------
    - name: Setup dotnet
      if: matrix.binding == 'dotnet'
      uses: actions/setup-dotnet@v6
    - name: Build the dotnet native library
      if: matrix.binding == 'dotnet'
      working-directory: "lib/dotnet"
      run: cargo build --release

    # --- java / kotlin ----------------------------------------------------
    # One JDK for both. The dumper scripts do not run maven's `compile` phase,
    # so nothing here builds the JNI shim — the AST is plain Java over Jackson
    # and, for kotlin, plain Kotlin over the same classes.
    - name: Setup JDK
      if: matrix.binding == 'java' || matrix.binding == 'kotlin'
      uses: actions/setup-java@v6.0.1
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'
    # The kotlin dumper needs `kotlin-compiler` 1.9.25, which is a *plugin*
    # dependency and so is absent from a fresh local maven repository. The
    # script falls back to `dependency:go-offline` on its own, but doing it
    # here turns a silent minute-long resolve inside the harness into a step
    # whose failure is attributable.
    - name: Resolve the kotlin compiler
      if: matrix.binding == 'kotlin'
      working-directory: "lib/kotlin"
      run: mvn -q dependency:go-offline

    - name: Diff this binding against the golden capture
      run: ruby hack/ast_diff.rb ${{ matrix.binding }}
