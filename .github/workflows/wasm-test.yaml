name: wasm-test

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
    paths:
      - "wasm/**"
      - ".github/workflows/wasm-test.yaml"
  workflow_dispatch:

jobs:
  test-and-release:
    name: Test and Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    # Notes: this defaults only apply on run tasks.
    defaults:
      run:
        working-directory: "wasm"

    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      # TODO: wasmtime exception handling support
      # - name: Rust example e2e tests
      #   uses: dtolnay/rust-toolchain@1.91
      #   with:
      #     components: clippy, rustfmt
      #   run: cd examples/rust && cargo test -r

      # - name: Go example e2e tests
      #   uses: actions/setup-go@v6
      #   with:
      #     go-version: 1.23
      #   run: cd examples/go && go mod tidy && go run main.go

      - name: Node.js example e2e tests
        run: cd examples/node && npm install && npm run build

      - name: Browser example e2e tests
        run: cd examples/browser && npm install && npm run build

      - name: Publish Dry Run
        if: "startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-')"
        # Since this command will not exit with non-zero code when file missing,
        # we need to check the output manually.
        run: npm publish --access public --provenance --dry-run
        env:
          # Inject auth so npm reports a clear E404 (scope permission issue)
          # rather than an opaque auth failure during dry-run validation.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: "startsWith(github.ref, 'refs/tags/')"
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
          npm publish --access public --provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
