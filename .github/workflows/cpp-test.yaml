name: cpp-test

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - main
    paths:
      - "cpp/**"
      # ast_contract decodes the captured parser output as its fixture, so
      # regenerating the golden file must re-run this workflow.
      - "testdata/ast/**"
      # The consistency runner reads this shared manifest, so a golden-only
      # change must re-run this workflow.
      - "tests/consistency/**"
      - ".github/workflows/cpp-test.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    defaults:
      run:
        working-directory: "cpp"
    strategy:
      matrix:
        os: [macos-15-intel, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        # nlohmann/json is the facade's preferred JSON backend. ctest runs the
        # facade example twice (default backend + `facade_bundled_json`, which
        # forces the bundled parser), so both paths stay covered; installing
        # the package is what makes the default backend the nlohmann one.
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install libgtest-dev ninja-build nlohmann-json3-dev
        else
          brew install nlohmann-json
        fi
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.91
        override: true
        components: clippy, rustfmt
    - name: Build
      run: |
        # Set cargo build target on macos
        export MACOSX_DEPLOYMENT_TARGET=12.0
        mkdir build
        cd build
        cmake .. -DKCL_LIB_ENABLE_TESTING=ON
        make -j8
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure
    - name: Run Examples
      shell: bash
      run: |
        cd build
        for file in ./*
        do
          if [[ -f "$file" && -x "$file" ]]; then
            echo "Executing: $file"
            if ! "$file"; then
              echo "Error occurred while executing $file. Exiting script."
              exit 1
            fi
          fi
        done
