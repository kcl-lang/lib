name: vendor-libs

# The development branches deliberately do not carry the prebuilt libkcl
# binaries or kcl.wasm — they are ~370MB of compiled artifacts reproducible
# from the kcl-lang/kcl release of the same version. This workflow vendors them
# onto a release branch, and release tags are cut from that branch so consumers
# pinning a tag get a self-contained tree.
#
# Why a branch and not a force-moved tag: wasm-test.yaml publishes
# @kcl-lib/wasm to npm on a tag push, and kcl.wasm is in that package's `files`
# array. Vendoring by force-updating the tag after the fact would let npm
# publish run against the pre-vendoring commit and silently ship a package with
# no runtime in it. See docs/lib-vendoring.md for the full procedure.
on:
  push:
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      branch:
        description: Release branch to vendor onto, e.g. release/v0.13.2
        required: true
        type: string
      kcl_version:
        description: >-
          kcl-lang/kcl release to fetch from. Defaults to the version in the
          branch name. Override only when the lib and kcl versions diverge.
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

# contents: write so the vendoring commit can be pushed back to the branch.
permissions:
  contents: write

jobs:
  # The kcl-lang/kcl release has to be published before this branch is pushed;
  # see docs/lib-vendoring.md.
  prebuilt:
    name: Fetch prebuilt runtimes
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.vars.outputs.branch }}
      lib_version: ${{ steps.vars.outputs.lib_version }}
      kcl_version: ${{ steps.vars.outputs.kcl_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve versions
        id: vars
        env:
          DISPATCH_BRANCH: ${{ inputs.branch }}
          DISPATCH_KCL_VERSION: ${{ inputs.kcl_version }}
          PUSH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            branch="$DISPATCH_BRANCH"
          else
            branch="${PUSH_REF#refs/heads/}"
          fi
          if [[ ! "$branch" =~ ^release/v[0-9] ]]; then
            echo "::error::expected a release/v<version> branch, got '$branch'"
            exit 1
          fi

          # The lib version is the branch name; the SDK advertises it on first
          # run and InstallKcl keys its cache directory off it, so vendoring a
          # libkcl from a different version than the SDK claims would be a
          # silent ABI mismatch. Same guard as publish-kcltool.yaml.
          lib_version="v${branch#release/}"
          sdk_version="$(sed -nE 's/^const KCL_VERSION[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' go/install/install.go)"
          echo "branch:          $branch"
          echo "lib version:     $lib_version"
          echo "SDK KCL_VERSION: $sdk_version"
          if [ "$sdk_version" != "$lib_version" ]; then
            echo "::error::go/install/install.go KCL_VERSION ($sdk_version) does not match the branch version ($lib_version). Bump one of them before vendoring."
            exit 1
          fi

          kcl_version="$DISPATCH_KCL_VERSION"
          if [ -z "$kcl_version" ]; then
            kcl_version="$lib_version"
          fi
          echo "kcl release:     $kcl_version"
          {
            echo "branch=$branch"
            echo "lib_version=$lib_version"
            echo "kcl_version=$kcl_version"
          } >> "$GITHUB_OUTPUT"

      - name: Download and stage
        env:
          KCL_VERSION: ${{ steps.vars.outputs.kcl_version }}
        run: |
          set -euo pipefail
          ./hack/download-libs.sh --version "$KCL_VERSION" \
            linux-amd64 linux-arm64 linux-musl-amd64 linux-musl-arm64 \
            darwin-amd64 darwin-arm64 windows-amd64 \
            wasm32-wasip1

          # windows-arm64 is fetched on a best-effort basis: kcl-lang/kcl#2219
          # added the target to that repo's release matrix, but no tag cut
          # before it carries a kcl-lib-<version>-windows-arm64.zip, so this
          # 404s for older kcl versions. Once the asset is published this
          # stages it like any other platform and stops being a no-op; until
          # then the sanity check in the vendor job reports the omission
          # rather than failing the whole run.
          ./hack/download-libs.sh --version "$KCL_VERSION" windows-arm64 \
            || echo "::warning title=No windows-arm64 asset::kcl-lang/kcl ${KCL_VERSION} publishes no kcl-lib-${KCL_VERSION}-windows-arm64.zip; go/lib/windows-arm64/kcl.dll will not be vendored"

      - name: Inventory
        run: |
          set -euo pipefail
          find go/lib wasm -type f \
            \( -name 'libkcl.*' -o -name 'kcl.dll' -o -name 'kcl.wasm' \) \
            -exec ls -la {} +

      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt-libs
          path: |
            go/lib/*/libkcl.so
            go/lib/*/libkcl.dylib
            go/lib/*/libkcl.a
            go/lib/*/kcl.dll
            wasm/kcl.wasm
          if-no-files-found: error

  # iOS has no prebuilt source: go/lib/ios-*/libkcl.a is the kcl-lib-c static
  # archive built from this repository's c/ crate, so it is cross-compiled
  # here rather than downloaded. Same recipe as build-libkcl-mobile.yaml.
  ios:
    name: Cross-compile iOS static archives
    runs-on: macos-latest
    needs: [prebuilt]
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          set -euo pipefail
          ./hack/download-libs.sh \
            --version "${{ needs.prebuilt.outputs.kcl_version }}" \
            ios-arm64 ios-arm64-sim

      - name: Verify architectures
        run: |
          set -euo pipefail
          lipo -info go/lib/ios-arm64/libkcl.a
          lipo -info go/lib/ios-arm64-sim/libkcl.a

      - uses: actions/upload-artifact@v7
        with:
          name: ios-libs
          path: |
            go/lib/ios-arm64/libkcl.a
            go/lib/ios-arm64-sim/libkcl.a
          if-no-files-found: error

  vendor:
    name: Commit the binaries onto the release branch
    runs-on: ubuntu-latest
    needs: [prebuilt, ios]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the commit lands on the branch tip.
          fetch-depth: 0
          ref: ${{ needs.prebuilt.outputs.branch }}

      - uses: actions/download-artifact@v8
        with:
          path: staged

      # Both artifacts are rooted at the repository, so they merge into one
      # staged/ tree without colliding on a path.
      - name: Merge into the working tree
        run: |
          set -euo pipefail
          test -d staged/go/lib || { echo "::error::no artifacts downloaded"; exit 1; }
          mkdir -p go/lib wasm
          cp -Rv staged/go/lib/. go/lib/
          test -f staged/wasm/kcl.wasm
          install -m 0755 staged/wasm/kcl.wasm wasm/kcl.wasm

      - name: Sanity-check the staged tree
        env:
          KCL_VERSION: ${{ needs.prebuilt.outputs.kcl_version }}
        run: |
          set -euo pipefail
          missing=0
          for f in \
            go/lib/darwin-amd64/libkcl.dylib go/lib/darwin-arm64/libkcl.dylib \
            go/lib/linux-amd64/libkcl.so    go/lib/linux-arm64/libkcl.so \
            go/lib/linux-musl-amd64/libkcl.a go/lib/linux-musl-arm64/libkcl.a \
            go/lib/windows-amd64/kcl.dll \
            go/lib/ios-arm64/libkcl.a       go/lib/ios-arm64-sim/libkcl.a \
            wasm/kcl.wasm ; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # windows-arm64 is expected to be absent for every kcl release
          # older than the one that first ships the asset; see the note in
          # the prebuilt job. Report it, but do not fail the run.
          if [ ! -s go/lib/windows-arm64/kcl.dll ]; then
            echo "::warning::go/lib/windows-arm64/kcl.dll not vendored: kcl-lang/kcl ${KCL_VERSION} publishes no such asset"
          fi
          du -sh go/lib wasm/kcl.wasm

      - name: Commit the binaries onto the branch
        env:
          BRANCH: ${{ needs.prebuilt.outputs.branch }}
          TAG: ${{ needs.prebuilt.outputs.lib_version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # go/.gitignore and wasm/.gitignore exclude these on purpose so the
          # development branches stay small. Force-add: this is the one place
          # the artifacts are meant to be tracked.
          #
          # Filtered through -s because git add fails outright on a pathspec
          # that matches nothing, and go/lib/windows-arm64/kcl.dll legitimately
          # does not exist for kcl releases that predate the asset.
          artifacts=(
            go/lib/darwin-amd64/libkcl.dylib go/lib/darwin-arm64/libkcl.dylib
            go/lib/linux-amd64/libkcl.so    go/lib/linux-arm64/libkcl.so
            go/lib/linux-musl-amd64/libkcl.a go/lib/linux-musl-arm64/libkcl.a
            go/lib/windows-amd64/kcl.dll    go/lib/windows-arm64/kcl.dll
            go/lib/ios-arm64/libkcl.a       go/lib/ios-arm64-sim/libkcl.a
            wasm/kcl.wasm
          )
          present=()
          for f in "${artifacts[@]}"; do
            [ -s "$f" ] && present+=("$f")
          done
          git add -f -- "${present[@]}"

          if git diff --cached --quiet; then
            echo "Already vendored; nothing to commit."
            exit 0
          fi
          git commit -m "chore(release): vendor prebuilt runtimes for ${TAG}"
          git push origin "HEAD:${BRANCH}"

      - name: Summary
        if: always()
        env:
          BRANCH: ${{ needs.prebuilt.outputs.branch }}
          TAG: ${{ needs.prebuilt.outputs.lib_version }}
        run: |
          echo "::notice title=Release branch ready::\`${BRANCH}\` now carries the prebuilt runtimes."
          echo "Cut the release tag from this branch, not from main:"
          echo '```'
          echo "git tag ${TAG} ${BRANCH}"
          echo "git push origin ${TAG}"
          echo '```'
